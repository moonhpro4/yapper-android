name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Yapper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Yapper.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Yapper.xcodeproj -scheme Yapper -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Show iOS errors
        if: failure()
        working-directory: ios
        shell: bash
        run: |
          grep -E "error:|\*\* BUILD FAILED|Unable|cannot|No such" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:600}"; done
          tail -15 build.log | while IFS= read -r l; do echo "::warning::${l:0:600}"; done
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Yapper.app Payload/
          zip -qr Yapper-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/Yapper-iOS.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Yapper-Setup.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build DMGs
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install 2>&1 | tail -5
          sudo mdutil -a -i off || true
          if npx electron-builder --mac dmg --arm64 --x64 --publish never 2>&1 | tee build.log \
             && ls dist/Yapper-macOS-arm64.dmg dist/Yapper-macOS-x64.dmg; then
            echo "electron-builder DMGs OK"
          else
            echo "::warning::electron-builder DMG step failed, building DMGs with hdiutil instead"
            for d in $(hdiutil info | grep -o '/dev/disk[0-9]*' | sort -u); do hdiutil detach -force "$d" || true; done
            rm -rf dist
            npx electron-builder --mac dir --arm64 --x64 --publish never 2>&1 | tee build2.log
            for pair in "arm64:dist/mac-arm64" "x64:dist/mac"; do
              arch="${pair%%:*}"; dir="${pair##*:}"
              rm -rf stage && mkdir stage
              cp -R "$dir/Yapper.app" stage/
              ln -s /Applications stage/Applications
              hdiutil create -volname "Install Yapper" -srcfolder stage -ov -format UDZO "dist/Yapper-macOS-$arch.dmg"
            done
            ls -la dist
          fi
      - name: Show macOS errors
        if: failure()
        working-directory: desktop
        shell: bash
        run: |
          cat build.log build2.log 2>/dev/null | grep -iE "error|failed|cannot|not found|⨯" | head -15 | while IFS= read -r l; do echo "::error::${l:0:600}"; done
          grep -iE "error|failed|cannot|not found|⨯" build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:600}"; done
          tail -15 build.log | while IFS= read -r l; do echo "::warning::${l:0:600}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desktop/dist/*.dmg

  release:
    needs: [android, ios, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List files
        run: ls -la artifacts
      - name: Move v1.0.0 tag to this commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f v1.0.0
          git push -f origin v1.0.0
      - name: Publish v1.0.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Yapper v1.0.0
          fail_on_unmatched_files: true
          body: |
            Yapper is an open source, free-to-use Discord alternative. These are the native app ports.

            | Platform | File |
            | --- | --- |
            | Android | `Yapper.apk` |
            | iOS / iPadOS | `Yapper-iOS.ipa` (unsigned, sideload with AltStore / Sideloadly) |
            | macOS (Apple Silicon) | `Yapper-macOS-arm64.dmg` |
            | macOS (Intel) | `Yapper-macOS-x64.dmg` |
            | Windows | `Yapper-Setup.exe` (installer wizard) |

            Builds are unsigned, so Windows SmartScreen and macOS Gatekeeper may warn on first launch. See the README for how to open them.
          files: |
            artifacts/Yapper.apk
            artifacts/Yapper-iOS.ipa
            artifacts/Yapper-Setup.exe
            artifacts/Yapper-macOS-arm64.dmg
            artifacts/Yapper-macOS-x64.dmg
